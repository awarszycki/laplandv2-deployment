services:
  lapland_backend:
    build: ./backend
    container_name: lapland_backend
    restart: unless-stopped
    # USUNIĘTE: privileged / seccopm:unconfined — backend tego nie potrzebuje,
    # a dawało to kontenerowi praktycznie roota na hoście.
    # USUNIĘTE: ports "8000:8000" — backend jest osiągalny tylko dla Caddy
    # przez wewnętrzną sieć Dockera (lapland_backend:8000). Nie ma go już na świecie.
    # Gdybyś chciał lokalny dostęp do debugowania, odkomentuj TYLKO localhost:
    # ports:
    #   - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=lapland_db
      - DB_PORT=3306
      - DB_USER=lapland
      - DB_PASSWORD=lapland_pass
      - DB_NAME=lapland
    depends_on:
      - db

  lapland_frontend:
    build: ./frontend
    container_name: lapland_frontend
    restart: unless-stopped
    # Frontend (Caddy) to jedyny punkt wejścia wystawiony na zewnątrz.
    ports:
      - "3030:80"
    depends_on:
      - lapland_backend

  db:
    image: mariadb:11
    container_name: lapland_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=lapland
      - MYSQL_USER=lapland
      - MYSQL_PASSWORD=lapland_pass
    # USUNIĘTE: ports "3306:3306" — baza NIE jest już wystawiona na internet.
    # Backend łączy się z nią po wewnętrznej sieci Dockera (lapland_db:3306).
    # Migracje nadal działają przez: docker exec -i lapland_db mariadb ...
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mariadb_data:
